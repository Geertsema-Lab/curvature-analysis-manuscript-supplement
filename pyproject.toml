# https://peps.python.org/pep-0517/
[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]


[project]
name = "imcurvpy"
description = "Code for the analysis of nuclear lamina 3D confocal images."
readme = "README.md"
authors = [
    { name = "Boyd Peters", email = "B.C.Peters@tudelft.nl" }
]
requires-python = ">=3.11"
license = { text = "BSD 3-Clause License" }
dynamic = ["version"]
dependencies = [
    "matplotlib>=3.9.0",
    "numba>=0.61.2",
    "numpy>=2.1",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.6.0",
    "scipy>=1.16.1",
    "tifffile>=2025.6.11",
    "polars>=1.25.2",
    "seaborn>=0.13",
    "pyyaml>=6.0.0",
    "napari>=0.7.1",
    "pyqt6>=6.9.1",
]

# To allow for dependency-groups and inter-operability between uv and pip: https://github.com/astral-sh/uv/issues/11093
[project.optional-dependencies]
gwdt = ["scikit-fmm"]
dev = ["pytest", "ruff"]   # dev deps still go in the dev extra for now

[dependency-groups]
gwdt = ["imcurvpy[gwdt]"]
dev = ["imcurvpy[gwdt,dev]"]  # reference dev extra in dependency-groups.dev

[tool.uv.sources]
imcurvpy = { workspace = true }   # declare local source

[project.scripts]
imcurvpy = "imcurvpy:main"

# https://hatch.pypa.io/latest/config/metadata/
[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata]
allow-direct-references = true

# https://hatch.pypa.io/latest/config/build/#file-selection
[tool.hatch.build.targets.sdist]
include = ["src", "tests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

# https://docs.astral.sh/ruff/rules/
[tool.ruff]
line-length = 88
target-version = "py311"
fix = true
unsafe-fixes = true

[tool.ruff.lint]
pydocstyle = { convention = "numpy" }
select = [
    "E",    # style errors
    "F",    # flakes
    "W",    # warnings
    "D",    # pydocstyle
    "I",    # isort
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "B",    # flake8-bugbear
    "A001", # flake8-builtins
    "RUF",  # ruff-specific rules
    "TID",  # tidy
    "TC",   # typecheck
    "SLF",  # private-access
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "D401", # First line should be in imperative mood (remove to opt in)
    "UP038", # Is deprecated (https://docs.astral.sh/ruff/rules/non-pep604-isinstance/)
]

# https://docs.astral.sh/ruff/formatter/
[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
minversion="6.0"
testpaths= ["tests"]

